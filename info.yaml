# Tiny Tapeout project information
project:
  title:        "8x16 Synchronous FIFO (custom GDS)"      # Project title
  author:       "S Harinarayanan"      # Your name
  discord:      "harimahaan"      # Your discord username, for communication and automatically assigning you a Tapeout role (optional)
  description:  "8-bit x 16-entry synchronous FIFO with full/empty flags, hardened with my own OpenLane backend"      # One line description of what your project does
  language:     "Verilog" # other examples include Verilog, Amaranth, VHDL, etc
  clock_hz:     50000000       # Clock frequency in Hz (or 0 if not applicable)

  # How many tiles your design occupies? A single tile is about 167x108 uM.
  tiles: "1x1"          # Valid values for analog projects: 1x2, 2x2

  # How many analog pins does your project use?
  analog_pins: 0        # Valid values: 0 to 6
  uses_vapwr: false       # Set to true if your project uses second analog power supply (VAPWR) in addition to 1.8V (VDPWR)

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_harinarayanans2006_fifo"

  # List your project's source files here. Source files must be in ./src and you must list each source file separately, one per line:
  source_files:        
    - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
# This section is for the datasheet/website. Use descriptive names (e.g., RX, TX, MOSI, SCL, SEG_A, etc.).
pinout:
  # Inputs
  ui[0]: "DIN0"
  ui[1]: "DIN1"
  ui[2]: "DIN2"
  ui[3]: "DIN3"
  ui[4]: "DIN4"
  ui[5]: "DIN5"
  ui[6]: "DIN6"
  ui[7]: "DIN7"

  # Outputs
  uo[0]: "DOUT0"
  uo[1]: "DOUT1"
  uo[2]: "DOUT2"
  uo[3]: "DOUT3"
  uo[4]: "DOUT4"
  uo[5]: "DOUT5"
  uo[6]: "DOUT6"
  uo[7]: "DOUT7"

  # Bidirectional pins
  uio[0]: "WR_EN (in)"
  uio[1]: "RD_EN (in)"
  uio[2]: "FULL (out)"
  uio[3]: "EMPTY (out)"
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

  # Analog pins - make sure to also set "analog_pins" above, else the pins won't be connected
  ua[0]: ""
  ua[1]: ""
  ua[2]: ""
  ua[3]: ""
  ua[4]: ""
  ua[5]: ""

# Do not change!
yaml_version: 6